[project]
name = "comfyui-llm-prompter-v2-test"
description = "Image prompt engine for ComfyUI: one node turns a brief plus reference images into a finished image prompt via a resident llama.cpp VLM, then encodes it to CONDITIONING. Tabbed panel with a drag-and-drop reference gallery, reference sets, @-insert reference tags, persona identity described once, composite/batch captioning and a prompt-list mode."
version = "0.0.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/artfat-creator/artfat-comfyui-llm-prompter-v2/tree/registry-test"
Issues = "https://github.com/artfat-creator/artfat-comfyui-llm-prompter-v2/issues"

[tool.comfy]
PublisherId = "artfat-creator"
DisplayName = "Artfat LLM Prompter v2 (registry test)"
Icon = ""
